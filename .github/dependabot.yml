# Atualizações semanais. Subir de LTS da JVM (eclipse-temurin, maven) é decisão registrada, não bump (D-5).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springdoc*"
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@next/*"]
      three:
        patterns: ["three", "@react-three/*", "@types/three"]
    ignore:
      # typescript-eslint aceita typescript < 6.1 e os plugins do eslint-config-next não aceitam o ESLint 10 (herdado do basquete).
      - dependency-name: typescript
        versions: [">=6.1.0"]
      - dependency-name: eslint
        versions: [">=10.0.0"]
    commit-message: { prefix: "chore(deps)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(ci)" }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
    ignore:
      # As tags 3.9-eclipse-temurin-25 e 25-jre já recebem as correções da JVM e do Maven no `docker build --pull`; o que o
      # Dependabot propõe para elas é trocar de JVM (24, 26), que é decisão, não bump (D-5).
      - dependency-name: eclipse-temurin
      - dependency-name: maven
    commit-message: { prefix: "chore(deps)" }
