="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.7441" x="394.5" y="307.7324">advance(QUARTER) &#8804; 500 ms</text></g><g id="Reproduzindo"><rect fill="#FFF7EE" height="64.2344" rx="12.5" ry="12.5" style="stroke:#DC5B26;stroke-width:0.5;" width="183.8281" x="420" y="439.2969"/><line style="stroke:#DC5B26;stroke-width:0.5;" x1="420" x2="603.8281" y1="465.5938" y2="465.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.8721" x="463.478" y="457.292">Reproduzindo</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="139.2246" x="425" y="481.7324">msPorJogada calculado</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.8281" x="425" y="495.7012">rel&#243;gio do or&#231;amento corre</text></g><g id="Decidindo"><rect fill="#FFF7EE" height="64.2344" rx="12.5" ry="12.5" style="stroke:#DC5B26;stroke-width:0.5;" width="227.6797" x="7" y="580.2969"/><line style="stroke:#DC5B26;stroke-width:0.5;" x1="7" x2="234.6797" y1="606.5938" y2="606.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="121.9189" x="59.8804" y="598.292">Decidindo jogada</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="110.5313" x="12" y="622.7324">momento decisivo</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.6797" x="12" y="636.7012">or&#231;amento pausado &#183; tempo limite</text></g><g id="Acelerando"><rect fill="#FFF7EE" height="64.2344" rx="12.5" ry="12.5" style="stroke:#DC5B26;stroke-width:0.5;" width="242.1523" x="373" y="580.2969"/><line style="stroke:#DC5B26;stroke-width:0.5;" x1="373" x2="615.1523" y1="606.5938" y2="606.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.0508" x="454.5508" y="598.292">Acelerando</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="123.873" x="378" y="622.7324">atraso vs or&#231;amento</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="222.1523" x="378" y="636.7012">resume jogadas sem lance relevante</text></g><g id="Instantanea"><rect fill="#FFF7EE" height="64.2344" rx="12.5" ry="12.5" style="stroke:#DC5B26;stroke-width:0.5;" width="160.1914" x="931" y="345.2969"/><line style="stroke:#DC5B26;stroke-width:0.5;" x1="931" x2="1091.1914" y1="371.5938" y2="371.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.3711" x="969.4102" y="363.292">Instant&#226;nea</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="140.1914" x="936" y="387.7324">simQuarterMinutes = 0</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="64.4414" x="936" y="401.7012">FULL &lt; 5 s</text></g><g id="Concluida"><rect fill="#FFF7EE" height="50.2656" rx="12.5" ry="12.5" style="stroke:#DC5B26;stroke-width:0.5;" width="246.8516" x="842.5" y="587.2969"/><line style="stroke:#DC5B26;stroke-width:0.5;" x1="842.5" x2="1089.3516" y1="613.5938" y2="613.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="69.0293" x="931.4111" y="605.292">Conclu&#237;da</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="226.8516" x="847.5" y="629.7324">dura&#231;&#227;o real registrada vs or&#231;amento</text></g><ellipse cx="657" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="966" cy="716.2969" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="966" cy="716.2969" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><!--link *start* to Planejada--><g class=